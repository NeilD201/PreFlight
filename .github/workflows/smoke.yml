name: smoke
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --target .deps -r requirements.txt
          pip install pytest
      - name: Unit tests (no KiCad, no API keys)
        shell: bash
        run: |
          python -m pytest tests/test_kicad_discovery.py tests/test_component_phrases.py tests/test_webapp.py tests/test_ai_review.py tests/test_investigation.py -q -p no:cacheprovider
      - name: Start server and probe health endpoints
        shell: bash
        run: |
          python main.py --web --port 8765 --no-browser &
          SRV=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8765/api/config >/dev/null; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8765/api/config | python -c "import json,sys; d=json.load(sys.stdin); assert d.get('app_version'), 'missing version'"
          curl -sf http://127.0.0.1:8765/api/demo-projects | python -c "import json,sys; d=json.load(sys.stdin); assert len(d.get('demos',[]))==2, 'demo boards missing'"
          curl -sf http://127.0.0.1:8765/ -o /dev/null
          kill $SRV
